services:
  # 1. Backend Web Service
  - type: web
    name: cardsplit-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: cardsplit-frontend
          property: host
    healthCheckPath: /api/v1/health

  # 2. Frontend Static Site
  - type: web
    name: cardsplit-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cardsplit-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
